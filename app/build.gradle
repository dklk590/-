plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordweave.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wordweave.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        debug {
            // Keep the local update certificate private. CI uses Gradle's generated debug key.
            def localDebugKey = rootProject.file('signing/debug.keystore')
            if (localDebugKey.exists()) {
                storeFile localDebugKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
