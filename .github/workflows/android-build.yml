name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Test reading segmentation and voice fallback policy
        run: |
          mkdir -p /tmp/wordweave-speech-tests
          javac -source 8 -target 8 -encoding UTF-8 -d /tmp/wordweave-speech-tests app/src/main/java/com/wordweave/app/SpeechText.java app/src/main/java/com/wordweave/app/SpeechVoice.java app/src/main/java/com/wordweave/app/SpeechProgress.java tests/SpeechPolicyTest.java
          java -cp /tmp/wordweave-speech-tests com.wordweave.app.SpeechPolicyTest

      - name: Test meaning choices, word families, scheduling and AI protocol
        run: |
          mkdir -p /tmp/wordweave-learning-tests
          curl --fail --location --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/wordweave-learning-tests/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/wordweave-learning-tests/json.jar' | sha256sum -c -
          test_cp="/tmp/wordweave-learning-tests/json.jar:${ANDROID_HOME}/platforms/android-35/android.jar:/tmp/wordweave-learning-tests"
          javac -source 8 -target 8 -encoding UTF-8 -cp "$test_cp" -d /tmp/wordweave-learning-tests app/src/main/java/com/wordweave/app/VocabularyRules.java app/src/main/java/com/wordweave/app/WordRepository.java app/src/main/java/com/wordweave/app/LearningScheduler.java app/src/main/java/com/wordweave/app/AiClient.java app/src/main/java/com/wordweave/app/SecureSettings.java app/src/main/java/com/wordweave/app/ModelCatalog.java tests/VocabularyRulesTest.java tests/WordChoiceRulesTest.java tests/LearningSchedulerTest.java tests/AiProtocolTest.java
          java -cp "$test_cp" com.wordweave.app.VocabularyRulesTest "$PWD"
          java -cp "$test_cp" WordChoiceRulesTest
          java -cp "$test_cp" LearningSchedulerTest
          java -cp "$test_cp" com.wordweave.app.AiProtocolTest "$PWD"
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test offline playback pause and resume state
        run: |
          javac -source 8 -target 8 -encoding UTF-8 -d /tmp/wordweave-speech-tests app/src/main/java/com/wordweave/app/SpeechPlayback.java tests/SpeechPlaybackTest.java
          java -cp /tmp/wordweave-speech-tests com.wordweave.app.SpeechPlaybackTest

      - name: Verify pinned bundled dependencies
        run: python3 scripts/verify_dependencies.py

      - name: Build debug APK
        run: |
          # Exercise the JDK/Gradle extraction path from the published gzip files.
          rm -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so app/src/main/jniLibs/armeabi-v7a/libsherpa-onnx-jni.so
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        run: '"${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'

      - name: Verify native APK page alignment
        run: '"${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WordWeave-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # CI uploads only the APK, never keystore files. The runner's debug key is ephemeral.
