name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Test reading segmentation and voice fallback policy
        run: |
          mkdir -p /tmp/wordweave-speech-tests
          javac -source 8 -target 8 -encoding UTF-8 -d /tmp/wordweave-speech-tests app/src/main/java/com/wordweave/app/SpeechText.java app/src/main/java/com/wordweave/app/SpeechVoice.java app/src/main/java/com/wordweave/app/SpeechProgress.java tests/SpeechPolicyTest.java
          java -cp /tmp/wordweave-speech-tests com.wordweave.app.SpeechPolicyTest

      - name: Test offline playback pause and resume state
        run: |
          javac -source 8 -target 8 -encoding UTF-8 -d /tmp/wordweave-speech-tests app/src/main/java/com/wordweave/app/SpeechPlayback.java tests/SpeechPlaybackTest.java
          java -cp /tmp/wordweave-speech-tests com.wordweave.app.SpeechPlaybackTest

      - name: Verify pinned bundled dependencies
        run: python3 scripts/verify_dependencies.py

      - name: Build debug APK
        run: |
          # Exercise the JDK/Gradle extraction path from the published gzip files.
          rm -f app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so app/src/main/jniLibs/armeabi-v7a/libsherpa-onnx-jni.so
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK signature
        run: '"${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'

      - name: Verify native APK page alignment
        run: '"${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WordWeave-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # CI uploads only the APK, never keystore files. The runner's debug key is ephemeral.
